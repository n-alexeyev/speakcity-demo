<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9DB86A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak City">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<title>Speak City Demo</title>
<style>
@font-face{font-family:'Public Sans';font-weight:400;src:url(assets/fonts/public-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:600;src:url(assets/fonts/public-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Public Sans';font-weight:800;src:url(assets/fonts/public-sans-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-weight:700;src:url(assets/fonts/space-mono-latin-700-normal.woff2) format('woff2')}
/* Layout: desktop = phone-shaped stage + side panel; phone = full-screen stage, settings in a bottom sheet behind a gear button */
:root{--bg:#EFE6D6;--ink:#1d1d1f;--card:#FDF8EF;--line:#E4D6BD;--accent:#B85C38;--accent-ink:#fff;--stagebg:#6E8A45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--ink:#f3ede2;--card:#2a2621;--line:#443d33;--accent:#D0754F;--accent-ink:#1c1a17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a17;--ink:#f3ede2;--card:#2a2621;--line:#443d33;--accent:#D0754F;--accent-ink:#1c1a17;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif}
#wrap{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding-block:16px;padding-inline:16px;flex-wrap:wrap}
#stage{position:relative;height:min(92vh,960px);aspect-ratio:9/16;max-width:100%;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(60,40,20,.25);background:#9DB86A}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#panel{width:240px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
#panel h1{font-size:16px;margin:0}
#panel label{display:flex;flex-direction:column;gap:4px;font:700 11px 'Space Mono',monospace;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
#panel input[type=range]{width:100%;accent-color:var(--accent)}
#panel select,#panel button{font:15px 'Public Sans',sans-serif;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#panel button{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;cursor:pointer}
#panel button.ghost{background:transparent;color:var(--accent)}
#panel .note{font-size:12.5px;opacity:.7;line-height:1.4}
#panel button:focus-visible,#panel select:focus-visible,.fab:focus-visible{outline:2px solid #2F7FD8;outline-offset:1px}
.fab{display:none;position:fixed;z-index:20;width:46px;height:46px;border-radius:23px;border:0;background:rgba(29,29,31,.55);color:#fff;font-size:22px;line-height:46px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
#gear{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#fs{right:calc(66px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#sheetBg{display:none}
#close{display:none}
@media (max-width:760px),(max-height:520px){
  html,body{background:var(--stagebg);overflow:hidden;overscroll-behavior:none}
  #wrap{padding:0;height:100%;display:flex;align-items:center;justify-content:center}
  #stage{height:auto;width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;max-height:100dvh;border-radius:0;box-shadow:none}
  .fab{display:block}
  #panel{position:fixed;z-index:30;left:0;right:0;bottom:0;width:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .28s ease;max-height:80dvh;overflow:auto}
  body.sheet #panel{transform:none}
  body.sheet #sheetBg{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35)}
  #close{display:block;position:absolute;right:12px;top:10px;background:transparent!important;border:0!important;color:var(--ink)!important;font-size:22px!important;padding:4px 8px!important}
}
body.capture #panel,body.capture .fab{display:none!important}
body.capture #wrap{padding:0}
body.capture #stage{height:960px;width:540px;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c" aria-label="Speak City demo, 9:16"></canvas></div>
  <div id="sheetBg"></div>
  <div id="panel" role="dialog" aria-label="Demo settings">
    <button id="close" aria-label="Close settings">✕</button>
    <h1>Speak City · demo</h1>
    <label>Mode<select id="s_mode"><option value="auto">Auto video</option><option value="play">Play: tap buildings</option></select></label>
    <label>Character<select id="s_char"><option value="ana">Ana</option><option value="leo">Leo</option></select></label>
    <label>Dialogue language<select id="s_lang"><option value="es">Spanish</option><option value="fr">French</option><option value="it">Italian</option><option value="de">German</option></select></label>
    <label>Walk speed <span id="spv"></span><input id="s_speed" type="range" min="0.4" max="2.5" step="0.1"></label>
    <button id="restart">Apply &amp; restart</button>
    <button id="render" class="ghost">Render video</button>
    <div id="recstat" class="note">Renders the auto video in real time (about 60 s, 1080×1920) and saves it as a file. Keep the screen on while it records.</div>
  </div>
</div>
<button class="fab" id="fs" aria-label="Full screen">⛶</button>
<button class="fab" id="gear" aria-label="Settings">⚙︎</button>
<script>
// phone UI: settings sheet + full screen
(()=>{const b=document.body,t=()=>b.classList.toggle('sheet');document.getElementById('gear').onclick=t;document.getElementById('close').onclick=t;document.getElementById('sheetBg').onclick=t;
 const fs=document.getElementById('fs');const el=document.documentElement;const can=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!can||window.navigator.standalone)fs.style.display='none';
 else fs.onclick=()=>{const d=document;if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else can.call(el).catch?.(()=>{});};})();
</script>
<script>
'use strict';
// ============================================================ config
const Q=new URLSearchParams(location.search);
let SPEED=parseFloat(Q.get('speed')||'1')||1;
const CFG={rec:Q.has('rec'),mode:Q.get('mode')||'auto',char:Q.get('char')||'ana',lang:Q.get('lang')||'es',capture:Q.has('capture'),brand:Q.get('brand')||'Speak City',city:Q.get('city')||'Valmoreda'};
if(CFG.capture)document.body.classList.add('capture');
document.getElementById('s_char').value=CFG.char;document.getElementById('s_mode').value=CFG.mode;
{const sl=document.getElementById('s_speed'),sv=document.getElementById('spv');sl.value=SPEED;sv.textContent='×'+SPEED.toFixed(1);sl.oninput=()=>{SPEED=parseFloat(sl.value);sv.textContent='×'+SPEED.toFixed(1);};}document.getElementById('s_lang').value=CFG.lang;
document.getElementById('restart').onclick=()=>{const p=new URLSearchParams();p.set('speed',SPEED);p.set('mode',document.getElementById('s_mode').value);p.set('char',document.getElementById('s_char').value);p.set('lang',document.getElementById('s_lang').value);location.search=p.toString();};
const W=540,H=960,cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=(CFG.capture||CFG.rec)?2:Math.min(2,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;
const FONT="'Public Sans',system-ui,sans-serif",MONO="'Space Mono',monospace";
const C={terra:'#B85C38',terraL:'#D0703F',teal:'#4E9A82',gold:'#E0A93A',ink:'#1d1d1f',mute:'#7c7a76',grey:'#A9A39A',cream:'#FFFDF8'};

// ============================================================ layout (from the map editor)
const LAYOUT={"cols":35,"rows":33,"blocks":[
{"t":"cafe","x":15.5,"y":23.5,"w":2.5,"d":2.5,"face":"+y","order":3},{"t":"pharmacy","x":3,"y":11.5,"w":2.5,"d":2.5,"face":"+x","order":4},
{"t":"kiosk","x":17.5,"y":9,"w":1.5,"d":1.5,"face":"+y","order":5},{"t":"stall","x":21,"y":21.5,"w":2,"d":2,"face":"+y","order":2},
{"t":"taxi","x":30,"y":22.5,"w":2.5,"d":2,"face":"+y","order":1},{"t":"tasca","x":24,"y":10.5,"w":2.5,"d":2.5,"face":"+y","order":6},
{"t":"house2","x":16.7,"y":3.7,"w":1.6,"d":1.6,"face":"+x","order":0},{"t":"fountain","x":13.75,"y":12.75,"w":2.5,"d":2.5,"face":"+x","order":0},
{"t":"post","x":21.5,"y":16,"w":2.5,"d":2,"face":"+x","order":0},{"t":"police","x":9.5,"y":7.5,"w":2.5,"d":2.5,"face":"+y","order":0},
{"t":"house","x":2,"y":2.5,"w":2,"d":2,"face":"+x","order":0},
{"t":"tree","x":22,"y":28},{"t":"tree","x":8,"y":20},{"t":"tree","x":26,"y":17},{"t":"tree","x":14,"y":5},{"t":"tree","x":6.5,"y":4},{"t":"tree","x":6.5,"y":8.5},
{"t":"lamp","x":16.25,"y":28.25},{"t":"lamp","x":27.5,"y":12.5},{"t":"lamp","x":13.25,"y":8.25},{"t":"lamp","x":21.25,"y":26.25},{"t":"lamp","x":12.25,"y":20.25},{"t":"lamp","x":11.25,"y":12.25},{"t":"lamp","x":22.25,"y":13.25},{"t":"lamp","x":30.25,"y":19.25},
{"t":"bench","x":19,"y":14},{"t":"bench","x":15,"y":9},{"t":"bench","x":6,"y":7},{"t":"pots","x":13.8,"y":21.2}]};
const SPR={cafe:'cafe',pharmacy:'pharmacy',kiosk:'kiosk',stall:'stall',taxi:'taxi',tasca:'tasca',post:'post',police:'police',house:'house_a',house2:'house_b',fountain:'fountain',tree:'tree',lamp:'lamp',bench:'bench',pots:'pots'};
const PROP={tree:{w:1,s:1.35},lamp:{w:.5,s:1.5},bench:{w:1,s:1.2},pots:{w:1,s:1.2}};
const STOPS={
 taxi:{label:'Taxi',icon:'car',npc:'Driver'}, stall:{label:'Market',icon:'fruit',npc:'Vendor'},
 cafe:{label:'Café',icon:'cup',npc:'Lucía',scene:'cafe',lvl:12}, pharmacy:{label:'Pharmacy',icon:'cross',npc:'Javier',scene:'pharmacy',lvl:14},
 kiosk:{label:'Kiosk',icon:'paper',npc:'Carmen',scene:'kiosk',lvl:15}, tasca:{label:'Tapas bar',icon:'wine',npc:''},
 post:{label:'Post office',icon:'mail',locked:true}, police:{label:'Police',icon:'shield',locked:true}};
const LANG={
 es:{name:'Spanish',taxi:[['Son doce euros.','Aquí tiene. ¡Gracias!']],stall:[['¿Qué le pongo?','Un kilo de naranjas, por favor.']],
  cafe:[['¡Hola! ¿Qué te pongo?','Un café con leche, por favor.'],['¿Algo más?','Sí, un cruasán, gracias.']],
  pharmacy:[['Buenas tardes. Dígame, ¿qué necesita?','Algo para el dolor de cabeza.']],kiosk:[['¿Qué desea?','Un periódico y agua, por favor.']],tasca:[['¿Qué van a tomar?','Unas tapas y un vino tinto, por favor.']]},
 fr:{name:'French',taxi:[['Ça fait douze euros.','Voilà. Merci !']],stall:[['Qu’est-ce que je vous mets ?','Un kilo d’oranges, s’il vous plaît.']],
  cafe:[['Bonjour ! Je vous sers quoi ?','Un café crème, s’il vous plaît.'],['Autre chose ?','Oui, un croissant, merci.']],
  pharmacy:[['Bonjour. Qu’est-ce qu’il vous faut ?','Quelque chose pour la migraine.']],kiosk:[['Vous désirez ?','Un journal et de l’eau, merci.']],tasca:[['Qu’est-ce que je vous sers ?','Des tapas et un verre de rouge, s’il vous plaît.']]},
 it:{name:'Italian',taxi:[['Sono dodici euro.','Ecco a lei. Grazie!']],stall:[['Cosa le do?','Un chilo di arance, per favore.']],
  cafe:[['Ciao! Cosa ti preparo?','Un cappuccino, per favore.'],['Altro?','Sì, un cornetto, grazie.']],
  pharmacy:[['Buongiorno. Di cosa ha bisogno?','Qualcosa per il mal di testa.']],kiosk:[['Cosa desidera?','Un giornale e un’acqua, grazie.']],tasca:[['Cosa prendete?','Delle tapas e un rosso, per favore.']]},
 de:{name:'German',taxi:[['Das macht zwölf Euro.','Bitte schön. Danke!']],stall:[['Was darf’s sein?','Ein Kilo Orangen, bitte.']],
  cafe:[['Hallo! Was darf’s sein?','Einen Milchkaffee, bitte.'],['Noch etwas?','Ja, ein Croissant, danke.']],
  pharmacy:[['Guten Tag. Was brauchen Sie?','Etwas gegen Kopfschmerzen.']],kiosk:[['Was möchten Sie?','Eine Zeitung und Wasser, bitte.']],tasca:[['Was darf ich bringen?','Tapas und einen Rotwein, bitte.']]}};
const L=LANG[CFG.lang]||LANG.es;

// ============================================================ utils
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3),eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c=1.7;return Math.max(0,1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2))};
const eBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}

// ============================================================ assets
const IMG={};const A='assets/';
function load(key,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[key]=i;r();};i.onerror=()=>r();i.src=A+src;});}
const loads=[];
new Set(Object.values(SPR)).forEach(n=>loads.push(load(n,'sp/'+n+'.png')));
[0,1,2,3].forEach(i=>loads.push(load('park'+i,'sp/park'+i+'.png')));
['grass','paving','cobble'].forEach(n=>loads.push(load(n,'sp/'+n+'.jpg')));
['cafe','pharmacy','kiosk'].forEach(n=>{loads.push(load(n+'_bg','sc/'+n+'_bg.jpg'));loads.push(load(n+'_npc','sc/'+n+'_npc.png'));});
loads.push(load('logo','logo.png'));
loads.push(load('avatar','avatar_'+(CFG.char==='leo'?'leo':'ana')+'.jpg'));
loads.push(load('idle','idle/'+(CFG.char==='leo'?'leo':'ana')+'.png'));
loads.push(load('walker','walk/'+(CFG.char==='leo'?'leo':'ana')+'.png'));
let PAT={};
function makePatterns(){
  const mk=(img,filter)=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.filter=filter||'none';x.drawImage(img,0,0);return g.createPattern(c,'repeat');};
  PAT.grass=mk(IMG.grass,'saturate(.72) brightness(1.03) hue-rotate(-6deg)');PAT.paving=mk(IMG.paving);PAT.cobble=mk(IMG.cobble,'saturate(.9)');}

// ============================================================ camera & projection
const TW=64,TH=32,ZPX=TW/2*1.2247;
const cam={x:0,y:0,z:1,gx:0,gy:0,gz:1,shake:0,follow:false};
const isoX=(x,y)=>(x-y)*TW/2,isoY=(x,y)=>(x+y)*TH/2;
const CY=H*.54;
function P(x,y,z=0){const sh=cam.shake>0?Math.sin(now*60)*cam.shake*5:0;return[W/2+(isoX(x,y)-cam.x)*cam.z+sh,CY+(isoY(x,y)-z*ZPX-cam.y)*cam.z];}
function lookAt(x,y){cam.gx=isoX(x,y);cam.gy=isoY(x,y);}
function isoTransform(){const k=cam.z,sh=cam.shake>0?Math.sin(now*60)*cam.shake*5:0;g.setTransform(DPR*k*TW/2,DPR*k*TH/2,-DPR*k*TW/2,DPR*k*TH/2,DPR*(W/2-cam.x*k+sh),DPR*(CY-cam.y*k));}
function patScale(p,tiles,img){const m=new DOMMatrix();m.scaleSelf(tiles/img.width,tiles/img.height);p.setTransform(m);}

// ============================================================ world build
const B=LAYOUT.blocks.map((b,i)=>Object.assign({id:i,w:PROP[b.t]?.w||b.w||1,d:PROP[b.t]?.w||b.d||1,face:b.face||'+x',order:b.order||0,t0:99,landed:false,glow:0},b));
const byT=t=>B.find(b=>b.t===t);
function doorPt(b,off){const f=b.face==='+x'?[1,0]:b.face==='+y'?[0,1]:b.face==='-x'?[-1,0]:[0,-1];return[b.x+b.w/2+f[0]*(b.w/2+off),b.y+b.d/2+f[1]*(b.d/2+off)];}
const ROUTE=B.filter(b=>b.order>0).sort((a,b)=>a.order-b.order);
const CTRL=ROUTE.map(b=>doorPt(b,1.0));
const SEG=48,CURVE=[];
function cr(p0,p1,p2,p3,t){return[0,1].map(i=>.5*((2*p1[i])+(-p0[i]+p2[i])*t+(2*p0[i]-5*p1[i]+4*p2[i]-p3[i])*t*t+(-p0[i]+3*p1[i]-3*p2[i]+p3[i])*t*t*t));}
for(let i=0;i<CTRL.length;i++){const n=CTRL.length;for(let k=0;k<SEG;k++)CURVE.push(cr(CTRL[(i-1+n)%n],CTRL[i],CTRL[(i+1)%n],CTRL[(i+2)%n],k/SEG));}
{const cb=B.find(b=>b.t==='cafe');cb.x+=1.3;cb.y-=0.5;} // cafe sits on the grass, the road keeps its original line
const nearestIdx=(p)=>{let bi=0,bd=1e9;CURVE.forEach((q,i)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;bi=i;}});return bi;};
const taxiFront=CTRL[0];
const FOUNT=byT('fountain'),FC=[FOUNT.x+FOUNT.w/2,FOUNT.y+FOUNT.d/2];
// outskirts: dense generated park chunks around the town, a light band of trees closer in
const OUT=[],PARKS=[];
{const near=(x,y,r)=>CURVE.some(q=>Math.hypot(q[0]-x,q[1]-y)<r)||B.some(b=>Math.hypot(b.x+b.w/2-x,b.y+b.d/2-y)<r)||(Math.abs(y-taxiFront[1])<r&&x>taxiFront[0]-2);
 const S=5;let k=0;
 for(let cx=-45;cx<80;cx+=S)for(let cy=-45;cy<80;cy+=S){const pts=[[cx,cy],[cx+S,cy],[cx,cy+S],[cx+S,cy+S],[cx+S/2,cy+S/2]];
   if(pts.some(p=>near(p[0],p[1],3.2)))continue;PARKS.push({t:'park'+((Math.abs(cx*7+cy*13)/5|0)%4),x:cx,y:cy,w:S,d:S,park:true,flip:((cx+cy)/5|0)%2===0});}
 for(let i=0;i<260;i++){const x=-2+rnd()*38,y=-2+rnd()*36;if(near(x,y,2.6))continue;if(PARKS.some(p=>x>p.x-.6&&x<p.x+p.w+.6&&y>p.y-.6&&y<p.y+p.d+.6))continue;
   if(OUT.some(o=>Math.hypot(o.x-x,o.y-y)<1.6))continue;OUT.push({t:'tree',x,y,w:1,d:1,face:'+x',order:0,t0:0,landed:true,out:true,sc:.85+rnd()*.3});}}
function drawPark(p){const img=IMG[p.t];if(!img)return;const bottom=P(p.x+p.w,p.y+p.d),left=P(p.x,p.y+p.d),right=P(p.x+p.w,p.y);
  const sw=(right[0]-left[0])*1.06,sh=sw*img.height/img.width;if(right[0]<-50||left[0]>W+50||bottom[1]<-20||bottom[1]-sh>H+20)return;
  g.save();g.translate((left[0]+right[0])/2,bottom[1]+6*cam.z);if(p.flip)g.scale(-1,1);g.drawImage(img,-sw/2,-sh,sw,sh);g.restore();}

// ============================================================ state
let now=0,DT=1/30;const tasks=[];const spawn=gen=>tasks.push(gen);
function* wait(s){let t=0;while(t<s){t+=DT;yield;}}
function* tween(s,fn,ease=eInOut){let t=0;while(t<s){t+=DT;fn(ease(clamp(t/s)));yield;}fn(1);}
const hero={x:taxiFront[0],y:taxiFront[1],visible:false,alpha:1,phase:0,moving:false,flip:false,t0:99,ci:0};
const hud={show:0,coins:240,gems:12,done:0,total:6,coinPulse:0,gemPulse:0,prog:0};
const flyers=[],dust=[],sparks=[],pops=[];
let pinsT0=99,activeStop=null,bubble=null,scene=null,iris=null,banner=null,endcard=null,pass=null,unlockT=Infinity;
const doneSet=new Set();

// ============================================================ helpers for flow
function burst(kind,x,y,n){for(let i=0;i<n;i++)flyers.push({kind,x0:x+(rnd()-.5)*30,y0:y+(rnd()-.5)*20,mx:x+(rnd()-.5)*170,my:y-90-rnd()*80,t0:now+i*.05,dur:.8});}
function* walkCurve(toIdx,speed=4.3,dir=1){const N=CURVE.length;hero.moving=true;
  while(hero.ci!==toIdx){
    let step=speed*SPEED*DT;while(step>0&&hero.ci!==toIdx){const q=CURVE[(hero.ci+dir+N)%N];const ddx=q[0]-hero.x,ddy=q[1]-hero.y,dd=Math.hypot(ddx,ddy);

// ============================================================ director

    yield* walkCurve(s*SEG);

// ============================================================ update
function update(dt){DT=dt;now+=dt;for(let i=tasks.length-1;i>=0;i--)if(tasks[i].next().done)tasks.splice(i,1);
  if(cam.follow){if(CFG.mode==='play'){const p=P(hero.x,hero.y);const mx=W*.28,my=H*.26;let dx=0,dy=0;if(p[0]<mx)dx=p[0]-mx;if(p[0]>W-mx)dx=p[0]-(W-mx);if(p[1]<my+60)dy=p[1]-(my+60);if(p[1]>H-my)dy=p[1]-(H-my);cam.gx=cam.x+dx/cam.z;cam.gy=cam.y+dy/cam.z;}else lookAt(hero.x,hero.y-.4);}
  const k=1-Math.pow(.015,dt);cam.x=lerp(cam.x,cam.gx,k);cam.y=lerp(cam.y,cam.gy,k);cam.z=lerp(cam.z,cam.gz,1-Math.pow(.06,dt));
  cam.shake=Math.max(0,cam.shake-dt*2);
  for(const b of B){if(!b.landed&&now>b.t0+.28){b.landed=true;if(!PROP[b.t]){cam.shake=Math.max(cam.shake,.18);
    for(let i=0;i<8;i++){const a=i/8*6.28;dust.push({x:b.x+b.w/2+Math.cos(a)*b.w*.6,y:b.y+b.d/2+Math.sin(a)*b.d*.6,t:now,r:.25});}
    const p=P(b.x+b.w/2,b.y+b.d/2,2);for(let i=0;i<6;i++)sparks.push({x:p[0],y:p[1],vx:(rnd()-.5)*240,vy:-rnd()*220-40,t:now});}}}
  hud.coinPulse=Math.max(0,hud.coinPulse-dt*3);hud.gemPulse=Math.max(0,hud.gemPulse-dt*3);hud.prog=lerp(hud.prog,hud.done,1-Math.pow(.01,dt));}

function icon(k,x,y,r){g.save();g.translate(x,y);g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=r*.13;g.lineCap='round';g.lineJoin='round';

  g.fillStyle='#fff';g.font=`800 24px ${FONT}`;g.fillText('Next stop: '+STOPS.tasca.label,0,15);g.restore();}
function drawEnd(){if(!endcard)return;const t=clamp((now-endcard.t0)/.6);g.save();g.fillStyle=`rgba(251,245,234,${.94*t})`;g.fillRect(0,0,W,H);g.globalAlpha=t;g.textAlign='center';g.textBaseline='alphabetic';
  if(IMG.logo){const lw=330,lh=lw*IMG.logo.height/IMG.logo.width,e0=eBack(clamp((now-endcard.t0)/.5));g.save();g.translate(W/2,H*.36);g.scale(e0,e0);g.drawImage(IMG.logo,-lw/2,-lh/2,lw,lh);g.restore();}else{g.fillStyle=C.ink;g.font=`800 46px ${FONT}`;g.fillText(CFG.brand,W/2,H*.4);}
  g.fillStyle=C.mute;g.font=`600 19px ${FONT}`;g.fillText(`Learn ${L.name} by living it`,W/2,H*.49);
  const e=eBack(clamp((now-endcard.t0-.35)/.5));g.save();g.translate(W/2,H*.58);g.scale(e,e);g.fillStyle=C.terra;rr(-125,-31,250,62,31);g.fill();g.fillStyle='#fff';g.font=`800 20px ${FONT}`;g.fillText('Start your trip',0,7);g.restore();g.restore();}
function drawVignette(){const gr=g.createRadialGradient(W/2,H*.52,H*.28,W/2,H*.52,H*.75);gr.addColorStop(0,'rgba(255,236,200,0)');gr.addColorStop(1,'rgba(120,90,40,.28)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const top=g.createLinearGradient(0,0,0,H*.22);top.addColorStop(0,'rgba(255,240,215,.55)');top.addColorStop(1,'rgba(255,240,215,0)');g.fillStyle=top;g.fillRect(0,0,W,H*.22);}

// ============================================================ frame
function draw(){g.setTransform(DPR,0,0,DPR,0,0);g.fillStyle='#9DB86A';g.fillRect(0,0,W,H);
  if(!scene){drawGround();drawDust();
    const items=[];for(const b of B)items.push({d:b.x+b.w/2+b.y+b.d/2,f:()=>drawBlock(b)});
    items.push({d:POLE.x+POLE.y+.2,f:drawFlagpole});
    for(const pk of PARKS)items.push({d:pk.x+pk.y+pk.w-1.2,f:()=>drawPark(pk)});
    for(const o of OUT){const p=P(o.x,o.y);if(p[0]<-200||p[0]>W+200||p[1]<-100||p[1]>H+400)continue;items.push({d:o.x+o.w/2+o.y+o.d/2,f:()=>drawBlock(o)});}
    items.push({d:hero.x+hero.y+.05,f:drawHero});items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
    drawVignette();drawPins();drawBubble();drawHUD();drawHint();}
  else drawScene();
  drawFlyers();drawIris();drawPass();drawBanner();drawEnd();}


// ============================================================ render video (real-time capture of the auto scenario)
document.getElementById('render').onclick=()=>{const p=new URLSearchParams();p.set('speed',SPEED);p.set('mode','auto');p.set('rec','1');p.set('char',document.getElementById('s_char').value);p.set('lang',document.getElementById('s_lang').value);location.search=p.toString();};
if(CFG.mode!=='auto')document.getElementById('render').hidden=true;
let recorder=null,chunks=[],recStart=0;const recEl=document.getElementById('recstat');
function startRecording(){if(!CFG.rec||!window.MediaRecorder)return;
  const types=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.4d0028','video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const type=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  recorder=new MediaRecorder(cv.captureStream(30),{mimeType:type,videoBitsPerSecond:14e6});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=saveRecording;recorder.start(1000);recStart=performance.now();
  const tick=()=>{if(recorder&&recorder.state==='recording'){recEl.textContent='Recording… '+Math.round((performance.now()-recStart)/1000)+' s';setTimeout(tick,500);}};tick();}
async function saveRecording(){const type=recorder.mimeType||'video/webm';const ext=type.includes('mp4')?'mp4':'webm';const blob=new Blob(chunks,{type});
  const name=`speakcity_${CFG.char}_${CFG.lang}.${ext}`;recEl.textContent='Saving '+name+'…';
  let dl=null;try{dl=await window.claude?.use?.('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:blob});recEl.textContent='Saved '+name;}catch(e){recEl.textContent=e&&e.code==='declined'?'Save cancelled':'Could not save: '+(e&&e.code||'error');}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();recEl.textContent='Saved '+name;}}

// ============================================================ boot
window.stepFrame=(dt=1/30)=>{update(dt);draw();};
window.grab=(q=.9)=>cv.toDataURL('image/jpeg',q);
Promise.all(loads).then(()=>Promise.all(['400 16px "Public Sans"','600 16px "Public Sans"','800 16px "Public Sans"','700 16px "Space Mono"'].map(f=>document.fonts.load(f).catch(()=>0)))).then(()=>{
  makePatterns();spawn(CFG.mode==='play'?playDirector():director());startRecording();window.__ready=true;
  if(!CFG.capture){let last=performance.now();const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();if(!window.__done||CFG.mode==='play')requestAnimationFrame(loop);else if(recorder){setTimeout(()=>recorder.stop(),400);}else setTimeout(()=>location.reload(),1800);};requestAnimationFrame(loop);}});
</script>
